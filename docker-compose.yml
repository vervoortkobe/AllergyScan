services:
  allergyscan-api:
    build:
      context: ./webapi/AllergyScan
      dockerfile: Dockerfile
    container_name: allergyscan-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: Data Source=/data/allergyscan.db
    volumes:
      - allergyscan-data:/data
    restart: unless-stopped

volumes:
  allergyscan-data:
